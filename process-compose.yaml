# Local dev supervisor. One command (`pnpm dev`) boots the whole app: the
# Railway dev containers, migrations, the atproto dev-env, and the web server —
# each as its own restartable, individually-logged process.
#
# The cron sync service is deliberately NOT here; run it on demand with
# `railway run --service atproto-cron-sync -- pnpm --filter=@buttery/atproto-cron-sync sync:once`.
#
# Humans: `pnpm dev` for the TUI (arrow keys to switch process, F5 restart,
# F10 quit). Agents: talk to the running instance over its REST API with
# `process-compose process list`, `… process restart web`, `… process logs web`,
# or just read the plain-text logs under `.dev-logs/`.
version: "0.5"

# Fail loudly on unknown/misspelled config keys instead of ignoring them.
is_strict: true
log_level: info

# Fallback file for any process that doesn't declare its own `log_location`.
log_location: ./.dev-logs/process-compose.log

processes:
  # ---------------------------------------------------------------------------
  # Dependency containers (Postgres, Redis, Caddy) owned by `railway dev`.
  # ---------------------------------------------------------------------------

  # `railway dev up` is idempotent and detaches: it starts the docker-compose
  # stack, prints the port/credential overview, and exits 0. So it runs as a
  # one-shot gate rather than a supervised long-running process — everything
  # that needs the containers waits on it completing.
  railway-dev:
    description: "Start the Railway dev containers (postgres, redis, caddy)"
    command: "railway dev up --no-tui"
    working_dir: "."
    availability:
      restart: "no"
    log_location: ./.dev-logs/railway-dev.log
    # `log_configuration` is per-process only (a top-level block is silently
    # ignored), so it's defined once here and aliased by every other process.
    log_configuration: &log_config
      # Each file already holds exactly one process's output, so a JSON envelope
      # and a repeated process name buy nothing — plain `<timestamp> <INF|ERR>
      # <line>` greps and diffs far better. Note the level is just the stream
      # (ERR == stderr), so plenty of `ERR` lines are ordinary tool chatter.
      disable_json: true
      no_metadata: true
      no_color: true
      add_timestamp: true
      # Without this the file writer is block-buffered, so `.dev-logs/*.log`
      # lag live output by up to 4 KB — useless for tailing a booting server.
      flush_each_line: true

  # The containers outlive process-compose (they are detached), so each one is
  # surfaced here as its own log stream. Stopping process-compose stops the
  # tails, not the databases — use `railway dev down` for that.
  postgres:
    description: "Postgres container logs (railway dev)"
    command: "node scripts/dev/railway-containers.mjs logs postgres"
    depends_on:
      railway-dev:
        condition: process_completed_successfully
    readiness_probe:
      exec:
        command: "node scripts/dev/railway-containers.mjs ready postgres"
      initial_delay_seconds: 2
      period_seconds: 2
      failure_threshold: 30
    log_location: ./.dev-logs/postgres.log
    log_configuration: *log_config

  redis:
    description: "Redis container logs (railway dev)"
    command: "node scripts/dev/railway-containers.mjs logs redis"
    depends_on:
      railway-dev:
        condition: process_completed_successfully
    readiness_probe:
      exec:
        command: "node scripts/dev/railway-containers.mjs ready redis"
      initial_delay_seconds: 2
      period_seconds: 2
      failure_threshold: 30
    log_location: ./.dev-logs/redis.log
    log_configuration: *log_config

  railway-proxy:
    description: "Caddy proxy container logs (railway dev)"
    command: "node scripts/dev/railway-containers.mjs logs railway-proxy"
    depends_on:
      railway-dev:
        condition: process_completed_successfully
    log_location: ./.dev-logs/railway-proxy.log
    log_configuration: *log_config

  # ---------------------------------------------------------------------------
  # App processes
  # ---------------------------------------------------------------------------

  # Schema catch-up on every boot. Cheap no-op when already current, and it
  # means a fresh clone (or a post-`railway dev clean` empty volume) works
  # without a documented extra step.
  migrate:
    description: "Apply pending Kysely migrations"
    command: "railway run --service buttery -- pnpm --filter=@buttery/web db:migrate:up"
    depends_on:
      postgres:
        condition: process_healthy
    availability:
      restart: "no"
    log_location: ./.dev-logs/migrate.log
    log_configuration: *log_config

  # Isolated PDS + local PLC. In-memory: every restart mints a new did:plc, so
  # restarting this process means re-signing-in to the app.
  atproto-dev-env:
    description: "Isolated atproto PDS + PLC (localhost:2583 / :2582)"
    command: "pnpm atproto:dev-env"
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 2583
        path: /xrpc/_health
        scheme: http
      initial_delay_seconds: 3
      period_seconds: 2
      failure_threshold: 60
    log_location: ./.dev-logs/atproto-dev-env.log
    log_configuration: *log_config

  web:
    description: "TanStack Start dev server (http://127.0.0.1:3000)"
    command: "railway run --service buttery -- pnpm dev:web"
    depends_on:
      migrate:
        condition: process_completed_successfully
      redis:
        condition: process_healthy
      atproto-dev-env:
        condition: process_healthy
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 3000
        path: /
        scheme: http
      initial_delay_seconds: 5
      period_seconds: 2
      failure_threshold: 60
    log_location: ./.dev-logs/web.log
    log_configuration: *log_config
