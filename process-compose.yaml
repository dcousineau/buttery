# Local dev supervisor. One command (`pnpm dev`) boots the whole app: the
# docker-compose dev containers, migrations, the atproto dev-env, and the web
# server — each as its own restartable, individually-logged process.
#
# process-compose owns the containers outright: `postgres` and `redis` run
# `docker compose up` attached, so the whole stack starts and stops together
# (`pnpm dev:down`). Data lives in named volumes and survives; wiping it is
# `docker compose down -v`.
#
# The cron sync is here but does not boot — it's a manual one-shot. Which
# network it sweeps into Postgres is `services/atproto-cron-sync/.env`'s call,
# not this file's.
#
# Humans: `pnpm dev` for the TUI (arrow keys to switch process, F5 restart,
# F10 quit). Agents: drive the running instance through the `pc_*` MCP tools
# (see `mcp_server` below); the `process-compose …` CLI and the plain-text logs
# under `.dev-logs/` remain available for anything the tools don't cover.
version: "0.5"

# Fail loudly on unknown/misspelled config keys instead of ignoring them.
is_strict: true
log_level: info

# MCP server for agents, wired into `.mcp.json` as the `process-compose` server.
# `expose_control_tools` is what turns on the built-in `pc_*` tools (list, get,
# logs, logs_search, ports, start/stop/restart, dependency graph, is-ready,
# project state) — without it the server only serves per-process `mcp:` blocks,
# of which this project has none.
#
# It runs INSIDE the project, so the tools exist only while the stack is up:
# booting and tearing down the stack itself stay CLI-only (`pnpm dev`,
# `pnpm dev:down`). Port 8098 sits next to the REST API's 8099 and well clear of
# the web server's 3000. Transport must be `sse`; the `stdio` alternative would
# have the MCP client spawn its own process-compose, which breaks the singleton.
mcp_server:
  host: localhost
  port: 8098
  transport: sse
  expose_control_tools: true

# Fallback file for any process that doesn't declare its own `log_location`.
log_location: ./.dev-logs/process-compose.log

processes:
  # ---------------------------------------------------------------------------
  # Dependency containers (Postgres, Redis), owned by the repo's docker-compose.
  #
  # Each is one process running `docker compose up` in the FOREGROUND, so the
  # process IS the container: process-compose starts it, streams its logs,
  # restarts it, and stops it. That is why docker-compose.yml carries no
  # `restart:` policy — a second supervisor would fight this one.
  #
  # Attached `up` behaves exactly as needed at both ends:
  #   * container dies    → `up` prints the exit and returns, so the process
  #                         goes down and `restart: always` brings it back
  #                         (`always`, not `on_failure`: compose can return 0
  #                         for a container that died, and `on_failure` would
  #                         file that as a clean completion and leave the
  #                         process dead — taking the readiness probe `web`
  #                         gates on with it).
  #   * process-compose   → compose catches SIGTERM and stops the container
  #     stops it            gracefully. Containers therefore do NOT outlive the
  #                         stack; the named volumes do, so no data is lost.
  #                         `docker compose down -v` is still what wipes data.
  #
  # Both processes run `up` for their own service concurrently. Whichever loses
  # the race to create the shared compose network logs a one-line
  # `network buttery_default already exists` error and carries on — noise, not a
  # failure.
  # ---------------------------------------------------------------------------

  # Probes talk the actual wire protocol from inside the container rather than
  # trusting `docker compose ps`, so `process_healthy` means "answering queries",
  # not "process started". Both go through `docker compose exec -T` (no TTY —
  # with one, exec fails outright under process-compose's non-tty stdin) rather
  # than `docker exec <name>`, which would hardcode the `buttery-postgres-1`
  # container-naming convention.
  postgres:
    description: "Postgres container (docker compose; host port 55432)"
    command: "docker compose up --no-log-prefix postgres"
    working_dir: "."
    availability: &container_availability
      restart: always
      backoff_seconds: 2
    readiness_probe:
      exec:
        # -U/-d match docker-compose.yml's healthcheck. Without them pg_isready
        # connects as the container's OS user and the server logs a noisy
        # `FATAL: role "root" does not exist` on every probe (still exit 0).
        command: "docker compose exec -T postgres pg_isready -q -U postgres -d buttery"
      initial_delay_seconds: 2
      period_seconds: 2
      failure_threshold: 30
    # A signal can't stop this container — the image's PID 1 swallows it (see
    # docker-compose.yml), so the default SIGTERM would hang 10s and then leave
    # postgres SIGKILLed mid-transaction, recovering on the next boot. `pg_ctl
    # stop -m fast` shuts the server down from inside instead: clients are
    # disconnected, open transactions roll back, and the container exits 0 in
    # well under a second, which ends the attached `up` on its own. The `||`
    # fallback covers the container already being gone.
    shutdown:
      command: "docker compose exec -T -u postgres postgres pg_ctl stop -m fast -D /var/lib/postgresql/data/pgdata || docker compose stop postgres"
      timeout_seconds: 30
    log_location: ./.dev-logs/postgres.log
    # `log_configuration` is per-process only (a top-level block is silently
    # ignored), so it's defined once here and aliased by every other process.
    log_configuration: &log_config
      # Each file already holds exactly one process's output, so a JSON envelope
      # and a repeated process name buy nothing — plain `<timestamp> <INF|ERR>
      # <line>` greps and diffs far better. Note the level is just the stream
      # (ERR == stderr), so plenty of `ERR` lines are ordinary tool chatter.
      disable_json: true
      no_metadata: true
      no_color: true
      add_timestamp: true
      # Without this the file writer is block-buffered, so `.dev-logs/*.log`
      # lag live output by up to 4 KB — useless for tailing a booting server.
      flush_each_line: true

  redis:
    description: "Redis container (docker compose; host port 56379)"
    command: "docker compose up --no-log-prefix redis"
    working_dir: "."
    availability: *container_availability
    readiness_probe:
      exec:
        # The password is the throwaway local-only one from docker-compose.yml
        # (see its header); change it there and this probe fails loudly rather
        # than silently. An unauthenticated `ping` would not do: redis-cli
        # answers `NOAUTH Authentication required.` and still exits 0, so only
        # matching PONG proves the server is actually serving commands.
        command: "docker compose exec -T redis redis-cli --no-auth-warning -a butterydev ping | grep -q PONG"
      initial_delay_seconds: 2
      period_seconds: 2
      failure_threshold: 30
    # Unlike postgres, redis is `exec`d as PID 1 and handles SIGTERM itself, so
    # the default signal shutdown exits 0 in ~1s. The bump off the 10s default
    # is only headroom for compose's own container stop.
    shutdown:
      timeout_seconds: 30
    log_location: ./.dev-logs/redis.log
    log_configuration: *log_config

  # ---------------------------------------------------------------------------
  # App processes
  # ---------------------------------------------------------------------------

  # Schema catch-up on every boot. Cheap no-op when already current, and it
  # means a fresh clone (or a post-`docker compose down -v` empty volume) works
  # without a documented extra step. DATABASE_URL comes from services/web/.env,
  # which kysely.config.ts loads itself (the CLI runs outside the dev server).
  migrate:
    description: "Apply pending Kysely migrations"
    command: "pnpm --filter=@buttery/web db:migrate:up"
    depends_on:
      postgres:
        condition: process_healthy
    availability:
      restart: "no"
    log_location: ./.dev-logs/migrate.log
    log_configuration: *log_config

  # Isolated PDS + local PLC. State persists under `.dev-data/atproto/`, so a
  # restart keeps the same did:plc and the browser session survives. Deleting
  # that directory mints a new DID and orphans buttery rows keyed to the old one.
  atproto-dev-env:
    description: "Isolated atproto PDS + PLC (localhost:2583 / :2582)"
    command: "pnpm atproto:dev-env"
    # `web` gates on this being healthy, so a crash that stays down blocks the
    # app from ever restarting. `max_restarts` bounds it: transient crashes heal,
    # a genuinely broken config gives up instead of looping forever.
    availability: &app_availability
      restart: on_failure
      backoff_seconds: 3
      max_restarts: 5
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 2583
        path: /xrpc/_health
        scheme: http
      initial_delay_seconds: 3
      period_seconds: 2
      failure_threshold: 60
    log_location: ./.dev-logs/atproto-dev-env.log
    log_configuration: *log_config

  web:
    description: "TanStack Start dev server (http://127.0.0.1:3000)"
    # Server-side config (DATABASE_URL, REDIS_URL, BLOB_S3_*, the ATPROTO_*
    # overrides, BETTER_AUTH_URL/VITE_APP_URL) comes from services/web/.env,
    # which vite.config.ts loads into process.env for dev (see its header). That
    # `.env` pins BETTER_AUTH_URL and VITE_APP_URL to http://127.0.0.1:3000 —
    # load-bearing: if the app decides it is not loopback, allowHttp goes false
    # and the local atproto dev-env PDS is rejected with "Unsecure resource
    # metadata URL (http:)", better-auth logs "Invalid origin", and the OAuth
    # client_id points at the production metadata document. This used to need a
    # `railway run … env BETTER_AUTH_URL=… VITE_APP_URL=…` wrapper because
    # `railway run` injected the PRODUCTION values (https://buttery.recipes) and
    # they beat `.env`; with `railway run` gone, `.env` is authoritative.
    command: "pnpm dev:web"
    depends_on:
      migrate:
        condition: process_completed_successfully
      redis:
        condition: process_healthy
      atproto-dev-env:
        condition: process_healthy
    availability: *app_availability
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 3000
        path: /
        scheme: http
      initial_delay_seconds: 5
      period_seconds: 2
      failure_threshold: 60
    log_location: ./.dev-logs/web.log
    log_configuration: *log_config

  # A sweep is a batch job, not a service: it runs to completion (`restart: "no"`
  # — `on_failure` would re-run a failed network sweep in a loop) and boots
  # `Disabled`, because sweeping is something you ask for, not part of having the
  # app up. `disabled` is a plain literal rather than `docs`'s ${VAR:-…} knob:
  # there is no "boot the whole stack and also run one sweep" case worth a flag.
  #
  # No `environment:` block, deliberately — which network a sweep reads is
  # `services/atproto-cron-sync/.env`'s call and nothing else's, so this process
  # and a shell run do the same thing.
  atproto-cron-sync:
    description: "One atproto → Postgres sync sweep — manual one-shot, starts Disabled"
    command: "pnpm --filter=@buttery/atproto-cron-sync sync:once"
    # It writes tables `migrate` creates. `atproto-dev-env` is in here because a
    # `.env` pointed at the local dev-env needs it up, and against the real
    # atmosphere it costs only a wait that has already happened.
    depends_on:
      migrate:
        condition: process_completed_successfully
      atproto-dev-env:
        condition: process_healthy
    disabled: true
    availability:
      restart: "no"
    log_location: ./.dev-logs/atproto-cron-sync.log
    log_configuration: *log_config

  # Opt-in. Docusaurus is a slow, memory-hungry second bundler and nothing else
  # in the stack needs it, so it is defined here — dependencies, probe, logs and
  # all — but boots `Disabled`. Three ways to get it running:
  #
  #   • TUI: select `docs`, then the "Start Process" shortcut in the footer
  #   • running stack: `process-compose process start docs`
  #   • from cold: `BUTTERY_DOCS_DISABLED=false pnpm dev` for the whole stack
  #     plus docs, or `pnpm dev docs` for docs and its dependencies alone
  #     (naming a process on `up` overrides `disabled`).
  docs:
    description: "Docusaurus docs site (http://127.0.0.1:3001) — opt-in, starts Disabled"
    command: "pnpm dev:docs"
    # Static site generator: no database, no auth, no atproto. It only waits on
    # the containers so that `pnpm dev docs` doesn't leave a half-booted stack
    # behind when someone then starts `web` from the TUI — naming a process on
    # `up` narrows the project to it and its dependency closure, so without
    # these two the containers wouldn't even be loaded.
    depends_on:
      postgres:
        condition: process_healthy
      redis:
        condition: process_healthy
    # `disabled` is a real bool, so the expansion has to yield a bare
    # `true`/`false` literal — hence the `:-` default rather than a `vars:`
    # entry (Go-template `{{ .X }}` values stay strings and fail to unmarshal).
    disabled: ${BUTTERY_DOCS_DISABLED:-true}
    availability: *app_availability
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 3001
        path: /
        scheme: http
      initial_delay_seconds: 5
      period_seconds: 2
      failure_threshold: 60
    log_location: ./.dev-logs/docs.log
    log_configuration: *log_config
