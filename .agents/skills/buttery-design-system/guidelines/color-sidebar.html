<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sidebar tokens</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;font-size:13px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{width:104px}.box{height:52px;border:2px solid var(--border);border-radius:var(--radius-md)}.nm{margin-top:5px;font-weight:600;font-size:11px;letter-spacing:.02em}.hx{font-size:10px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}.lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}</style>
</head><body>
<div class="sw"><div class="chip"><div class="box" style="background:#fff6e3"></div><div class="nm">--sidebar</div><div class="hx">#fff6e3</div></div><div class="chip"><div class="box" style="background:#ffd84d"></div><div class="nm">--sidebar-accent</div><div class="hx">#ffd84d</div></div><div class="chip"><div class="box" style="background:#e2231a"></div><div class="nm">--sidebar-primary</div><div class="hx">#e2231a</div></div><div class="chip"><div class="box" style="background:#2a1e12"></div><div class="nm">--sidebar-border</div><div class="hx">#2a1e12</div></div><div class="chip"><div class="box" style="background:#e2231a"></div><div class="nm">--sidebar-ring</div><div class="hx">#e2231a</div></div></div>
</body></html>
