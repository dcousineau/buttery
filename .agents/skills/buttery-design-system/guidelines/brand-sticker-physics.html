<!-- @dsCard group="Brand" viewport="700x170" name="Sticker physics" subtitle="Rest → hover lifts −2px → press sinks +2px" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sticker physics</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;font-size:13px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{width:104px}.box{height:52px;border:2px solid var(--border);border-radius:var(--radius-md)}.nm{margin-top:5px;font-weight:600;font-size:11px;letter-spacing:.02em}.hx{font-size:10px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}.lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}</style>
</head><body>
<div style="display:flex;gap:36px;align-items:center;padding:8px 0 0">
<div style="text-align:center"><div style="display:inline-flex;height:32px;align-items:center;padding:0 10px;border:2px solid var(--border);border-radius:var(--radius-lg);background:var(--primary);color:var(--primary-foreground);font-weight:600;font-size:14px;box-shadow:var(--shadow-pop)">Save recipe</div><div class="lbl" style="margin-top:8px">rest · pop 3px</div></div>
<div style="text-align:center"><div style="display:inline-flex;height:32px;align-items:center;padding:0 10px;border:2px solid var(--border);border-radius:var(--radius-lg);background:var(--primary);color:var(--primary-foreground);font-weight:600;font-size:14px;box-shadow:var(--shadow-pop-lg);transform:translate(-2px,-2px)">Save recipe</div><div class="lbl" style="margin-top:8px">hover · pop-lg</div></div>
<div style="text-align:center"><div style="display:inline-flex;height:32px;align-items:center;padding:0 10px;border:2px solid var(--border);border-radius:var(--radius-lg);background:var(--primary);color:var(--primary-foreground);font-weight:600;font-size:14px;box-shadow:var(--shadow-pop-sm);transform:translate(2px,2px)">Save recipe</div><div class="lbl" style="margin-top:8px">press · pop-sm</div></div>
</div>
<p style="margin:.7rem 0 0;color:var(--muted-foreground);font-size:11px">Solid variants only. Ghost and link stay perfectly flat.</p>
</body></html>
