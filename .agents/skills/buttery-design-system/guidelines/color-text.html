<!-- @dsCard group="Colors" viewport="700x160" name="Text colors" subtitle="Ink, muted ink, and the two on-color pairings" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Text colors</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;font-size:13px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{width:104px}.box{height:52px;border:2px solid var(--border);border-radius:var(--radius-md)}.nm{margin-top:5px;font-weight:600;font-size:11px;letter-spacing:.02em}.hx{font-size:10px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}.lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}</style>
</head><body>
<div class="sw">
<div style="width:150px"><div class="box" style="background:var(--background);color:var(--foreground);display:flex;align-items:center;justify-content:center;font-weight:600">Ink on cream</div><div class="nm">--foreground</div><div class="hx">#2a1e12</div></div>
<div style="width:150px"><div class="box" style="background:var(--background);color:var(--muted-foreground);display:flex;align-items:center;justify-content:center;font-weight:600">Muted body</div><div class="nm">--muted-foreground</div><div class="hx">#6b5b46</div></div>
<div style="width:150px"><div class="box" style="background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;justify-content:center;font-weight:600">On red</div><div class="nm">--primary-foreground</div><div class="hx">#fffdf4</div></div>
<div style="width:150px"><div class="box" style="background:var(--secondary);color:var(--secondary-foreground);display:flex;align-items:center;justify-content:center;font-weight:600">On butter</div><div class="nm">--secondary-foreground</div><div class="hx">#2a1e12</div></div>
</div>
<p style="margin:.6rem 0 0;color:var(--muted-foreground);font-size:11px">Red is for large text, borders and fills with cream text — never small body copy.</p>
</body></html>
