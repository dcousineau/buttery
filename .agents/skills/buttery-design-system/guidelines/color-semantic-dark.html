<!-- @dsCard group="Colors" viewport="700x150" name="Semantic — dark (“toasted”)" subtitle="Butter and a lifted red on deep brown-black" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Semantic dark</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;font-size:13px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{width:104px}.box{height:52px;border:2px solid var(--border);border-radius:var(--radius-md)}.nm{margin-top:5px;font-weight:600;font-size:11px;letter-spacing:.02em}.hx{font-size:10px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}.lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}</style>
</head><body>
<div class="sw"><div class="chip"><div class="box" style="background:#1c1106"></div><div class="nm">--background</div><div class="hx">#1c1106</div></div><div class="chip"><div class="box" style="background:#2a1b0c"></div><div class="nm">--card</div><div class="hx">#2a1b0c</div></div><div class="chip"><div class="box" style="background:#ff6242"></div><div class="nm">--primary</div><div class="hx">#ff6242</div></div><div class="chip"><div class="box" style="background:#ffd84d"></div><div class="nm">--secondary</div><div class="hx">#ffd84d</div></div><div class="chip"><div class="box" style="background:#3a2812"></div><div class="nm">--muted</div><div class="hx">#3a2812</div></div><div class="chip"><div class="box" style="background:#3d2b10"></div><div class="nm">--accent</div><div class="hx">#3d2b10</div></div></div>
</body></html>
