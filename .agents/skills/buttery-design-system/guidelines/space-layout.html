<!-- @dsCard group="Spacing" viewport="700x160" name="Layout constants" subtitle="Content column, header, nav rail" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Layout</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;font-size:13px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{width:104px}.box{height:52px;border:2px solid var(--border);border-radius:var(--radius-md)}.nm{margin-top:5px;font-weight:600;font-size:11px;letter-spacing:.02em}.hx{font-size:10px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}.lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}</style>
</head><body>
<div style="font-size:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center">
<code>--content-width</code><span>min(1080px, 100% - 2rem) — the <code>.page-wrap</code> column</span>
<code>--header-height</code><span>3.75rem default; measured at runtime so the fixed rail starts below it</span>
<code>--sidebar-width</code><span>16rem desktop · 18rem mobile drawer · 3rem icon-collapsed</span>
<code>--gingham-band-height</code><span>14px — the only gingham dimension in chrome</span>
</div>
</body></html>
