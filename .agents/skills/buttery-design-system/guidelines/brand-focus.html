<!-- @dsCard group="Brand" viewport="700x150" name="Focus & interaction states" subtitle="3px ring at 2px offset; inputs also gain a hard shadow" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Focus</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;font-size:13px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{width:104px}.box{height:52px;border:2px solid var(--border);border-radius:var(--radius-md)}.nm{margin-top:5px;font-weight:600;font-size:11px;letter-spacing:.02em}.hx{font-size:10px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}.lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}</style>
</head><body>
<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;padding-top:6px">
<div><div style="display:inline-flex;height:32px;align-items:center;padding:0 10px;border:2px solid var(--ring);border-radius:var(--radius-lg);background:var(--card);font-weight:600;font-size:14px;box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 50%,transparent),var(--shadow-pop)">Focused button</div><div class="lbl" style="margin-top:8px">focus-visible</div></div>
<div><input value="alice.bsky.social" readonly style="height:36px;width:200px;border:2px solid var(--ring);border-radius:var(--radius-lg);background:var(--card);padding:4px 12px;font-family:var(--font-sans);font-size:14px;color:var(--foreground);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 50%,transparent),var(--shadow-pop)"><div class="lbl" style="margin-top:8px">focused input — ring + pop</div></div>
</div>
</body></html>
