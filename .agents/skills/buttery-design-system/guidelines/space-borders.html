<!-- @dsCard group="Spacing" viewport="700x150" name="Borders" subtitle="2px ink everywhere structural; 1px only for internal rules" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Borders</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;font-size:13px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{width:104px}.box{height:52px;border:2px solid var(--border);border-radius:var(--radius-md)}.nm{margin-top:5px;font-weight:600;font-size:11px;letter-spacing:.02em}.hx{font-size:10px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}.lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}</style>
</head><body>
<div class="sw">
<div class="chip"><div style="height:52px;border:2px solid var(--border);border-radius:var(--radius-lg);background:var(--card)"></div><div class="nm">2px</div><div class="hx">buttons, cards, inputs, menus</div></div>
<div class="chip"><div style="height:52px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card)"></div><div class="nm">1px</div><div class="hx">Alert, row dividers</div></div>
<div class="chip"><div style="height:52px;border-bottom:2px solid var(--border)"></div><div class="nm">edge only</div><div class="hx">header, footer, image base</div></div>
</div>
</body></html>
