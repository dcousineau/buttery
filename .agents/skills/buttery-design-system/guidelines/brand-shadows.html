<!-- @dsCard group="Brand" viewport="700x160" name="Hard offset shadows" subtitle="Four steps, zero blur, always ink — the neo-brutalist core" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shadows</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;font-size:13px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{width:104px}.box{height:52px;border:2px solid var(--border);border-radius:var(--radius-md)}.nm{margin-top:5px;font-weight:600;font-size:11px;letter-spacing:.02em}.hx{font-size:10px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}.lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}</style>
</head><body>
<div class="sw">
<div class="chip" style="padding-right:8px"><div class="box" style="background:var(--card);box-shadow:var(--shadow-pop-sm);border-radius:var(--radius-lg)"></div><div class="nm">--shadow-pop-sm</div><div class="hx">2px offset</div></div><div class="chip" style="padding-right:8px"><div class="box" style="background:var(--card);box-shadow:var(--shadow-pop);border-radius:var(--radius-lg)"></div><div class="nm">--shadow-pop</div><div class="hx">3px offset</div></div><div class="chip" style="padding-right:8px"><div class="box" style="background:var(--card);box-shadow:var(--shadow-pop-md);border-radius:var(--radius-lg)"></div><div class="nm">--shadow-pop-md</div><div class="hx">4px offset</div></div><div class="chip" style="padding-right:8px"><div class="box" style="background:var(--card);box-shadow:var(--shadow-pop-lg);border-radius:var(--radius-lg)"></div><div class="nm">--shadow-pop-lg</div><div class="hx">6px offset</div></div>
</div>
<p style="margin:.6rem 0 0;color:var(--muted-foreground);font-size:11px">No blurred shadow, glow, or glass exists anywhere in Buttery.</p>
</body></html>
