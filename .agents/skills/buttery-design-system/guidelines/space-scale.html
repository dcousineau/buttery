<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;font-size:13px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{width:104px}.box{height:52px;border:2px solid var(--border);border-radius:var(--radius-md)}.nm{margin-top:5px;font-weight:600;font-size:11px;letter-spacing:.02em}.hx{font-size:10px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}.lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}</style>
</head><body>
<div style="display:flex;align-items:flex-end;gap:12px">
<div style="text-align:center"><div style="width:4px;height:4px;background:var(--secondary);border:2px solid var(--border)"></div><div class="hx" style="margin-top:4px">1</div></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--secondary);border:2px solid var(--border)"></div><div class="hx" style="margin-top:4px">2</div></div><div style="text-align:center"><div style="width:12px;height:12px;background:var(--secondary);border:2px solid var(--border)"></div><div class="hx" style="margin-top:4px">3</div></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--secondary);border:2px solid var(--border)"></div><div class="hx" style="margin-top:4px">4</div></div><div style="text-align:center"><div style="width:20px;height:20px;background:var(--secondary);border:2px solid var(--border)"></div><div class="hx" style="margin-top:4px">5</div></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--secondary);border:2px solid var(--border)"></div><div class="hx" style="margin-top:4px">6</div></div><div style="text-align:center"><div style="width:32px;height:32px;background:var(--secondary);border:2px solid var(--border)"></div><div class="hx" style="margin-top:4px">8</div></div><div style="text-align:center"><div style="width:40px;height:40px;background:var(--secondary);border:2px solid var(--border)"></div><div class="hx" style="margin-top:4px">10</div></div><div style="text-align:center"><div style="width:48px;height:48px;background:var(--secondary);border:2px solid var(--border)"></div><div class="hx" style="margin-top:4px">12</div></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--secondary);border:2px solid var(--border)"></div><div class="hx" style="margin-top:4px">16</div></div>
</div>
</body></html>
