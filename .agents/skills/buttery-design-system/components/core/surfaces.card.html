<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.row{display:flex;flex-wrap:wrap;gap:8px}</style>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Card, CardHeader, CardTitle, CardDescription, CardContent, Badge, Alert, AlertTitle, AlertDescription, Separator } = window.ButteryDesignSystem_79cab4;
const I = ({n}) => <i data-lucide={n}></i>;
function Demo(){return (<div className="grid">
  <Card>
    <CardHeader><CardTitle style={{display:'flex',alignItems:'center',gap:'.625rem',fontWeight:700}}><I n="cooking-pot"/>Cook mode<Badge variant="outline" style={{marginLeft:'auto',fontSize:'.6rem',letterSpacing:'.05em',textTransform:'uppercase'}}>priority</Badge></CardTitle></CardHeader>
    <CardContent><p style={{margin:0,color:'var(--muted-foreground)'}}>Recipes rendered huge and glare-proof for the counter.</p></CardContent>
  </Card>
  <Card style={{background:'var(--secondary)',color:'var(--secondary-foreground)'}}>
    <CardHeader><CardTitle className="display-title" style={{fontSize:'var(--text-lg)'}}>Don't have an account yet?</CardTitle>
    <CardDescription style={{color:'var(--secondary-foreground)'}}>Buttery doesn't host accounts — you bring your own.</CardDescription></CardHeader>
  </Card>
  <div style={{display:'flex',flexDirection:'column',gap:10}}>
    <div className="row"><Badge variant="secondary">A social recipe box</Badge><Badge>owner</Badge><Badge variant="outline">member</Badge></div>
    <div className="row"><Badge variant="outline">vegetarian</Badge><Badge variant="outline">Italian</Badge><Badge variant="destructive">expired</Badge><Badge variant="ghost" style={{borderColor:'var(--border)'}}>weeknight</Badge></div>
    <Separator/>
    <div className="row" style={{fontSize:'var(--text-xs)',color:'var(--muted-foreground)'}}>1px Separator above · badges are rounded-pill with a 2px ink border</div>
  </div>
  <div style={{display:'flex',flexDirection:'column',gap:10}}>
    <Alert><I n="info"/><AlertTitle>Recipes live in your PDS</AlertTitle><AlertDescription>Leave anytime and take the whole pantry.</AlertDescription></Alert>
    <Alert variant="destructive"><I n="triangle-alert"/><AlertTitle>Sign-in was not completed</AlertTitle><AlertDescription>Try again.</AlertDescription></Alert>
  </div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
setTimeout(()=>lucide.createIcons(),0);
</script>
</body></html>
