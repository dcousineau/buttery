monorepo_root = true

[settings]
# Take node/pnpm from package.json, the same fields CI reads (jdx/mise#8059):
# node from `devEngines.runtime`, pnpm from `packageManager`. Idiomatic version
# files are off by default, so both tools have to opt in here. Nothing else may
# pin these versions — one field each, and .nvmrc is vestigial.
idiomatic_version_file_enable_tools = ["node", "pnpm"]
experimental = true

[tools]
railway = "latest"
process-compose = "latest"

[monorepo]
config_roots = ["services/*", "packages/*"]

[deps.pnpm]
auto = true

[env]
# Dedicated port for the process-compose REST API so the dev supervisor never
# fights whatever else is squatting on its 8080 default. Setting it here means
# `process-compose up`, `attach`, and the `process …` client commands all agree
# on it inside this repo without anyone passing `-p`.
PC_PORT_NUM = "8099"

[tasks.railway-skills]
description = "Install Railway skills into this project"
run = "railway skills install"

# Create each service's .env from its .env.example (with a generated
# BETTER_AUTH_SECRET for web) when it's missing: services/web and
# services/pipeline. Runs before `setup:mcp` in the postinstall hook so
# the render has a real DATABASE_URL to bake in rather than the example's
# placeholder. Per-file no-op once a .env exists — it never overwrites.
[tasks."setup:env"]
description = "Create each service's .env from its .env.example if it does not exist"
run = "node scripts/dev/bootstrap-env.mjs"

# Render the gitignored .mcp.json from .mcp.json.example, baking in the dev
# DATABASE_URL from services/web/.env (see scripts/dev/render-mcp.mjs). No
# `railway run` — local dev's Postgres is docker-compose-owned now, and the
# script reads .env itself. Bootstrap-only: a no-op once .mcp.json exists, so
# the hook can't stomp a hand-edited file. `-- --force` re-renders on purpose.
# No `sources`/`outputs`: what goes stale is the DB URL inside an unchanged
# template, which an mtime check can't see.
[tasks."setup:mcp"]
description = "Render .mcp.json from .mcp.json.example with the dev DATABASE_URL (services/web/.env)"
run = "node scripts/dev/render-mcp.mjs"

# Re-render the files `setup:env` / `setup:mcp` refuse to touch once they exist:
# both are bootstrap-only by design, so a template that gains a key leaves every
# existing checkout's rendered file stale and silently short that key. This is
# the deliberate "regenerate from the templates" — run it after pulling a change
# to a `.env.example` or `.mcp.json.example`. Replaced files are renamed to
# `*.bak.<timestamp>` beside themselves (gitignored) first, so nothing is lost.
[tasks."setup:reset"]
description = "Back up and re-render the .env files and .mcp.json from their templates"
run = "node scripts/dev/reset-config.mjs"

[hooks]
# `;` not `&&`: the later steps must run even where railway-skills fails (cloud
# sessions have no Railway CLI / GitHub API), so the next session boots with
# .env and the MCP servers wired up regardless. setup:env precedes setup:mcp —
# the render reads DATABASE_URL out of the file setup:env creates.
postinstall = "mise run railway-skills; mise run setup:env; mise run setup:mcp"
