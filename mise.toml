monorepo_root = true

[settings]
# Take node/pnpm from package.json, the same fields CI reads (jdx/mise#8059):
# node from `devEngines.runtime`, pnpm from `packageManager`. Idiomatic version
# files are off by default, so both tools have to opt in here. Nothing else may
# pin these versions — one field each, and .nvmrc is vestigial.
idiomatic_version_file_enable_tools = ["node", "pnpm"]
experimental = true

[tools]
railway = "latest"
process-compose = "latest"

[monorepo]
config_roots = ["services/*", "packages/*"]

[deps.pnpm]
auto = true

[env]
# Dedicated port for the process-compose REST API so the dev supervisor never
# fights whatever else is squatting on its 8080 default. Setting it here means
# `process-compose up`, `attach`, and the `process …` client commands all agree
# on it inside this repo without anyone passing `-p`.
PC_PORT_NUM = "8099"

[tasks.railway-skills]
description = "Install Railway skills into this project"
run = "railway skills install"

[hooks]
postinstall = "mise run railway-skills"
