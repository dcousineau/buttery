# Local dev dependency containers — repo-owned, no Railway CLI or auth required.
#
# These are not started by hand: the `postgres` and `redis` processes in
# process-compose.yaml each run `docker compose up <service>` in the foreground,
# so `pnpm dev` starts them and `pnpm dev:down` stops them. `docker compose …`
# by hand still works for one-offs (`ps`, `exec`, `down -v`). Railway is no
# longer in the local loop at all; it stays only for deploys
# (.railway/railway.ts). Object storage used to be the one exception — the web
# service talked to the shared remote `buttery-uploads` bucket — and is now the
# `rustfs` service below.
#
# No service declares a `restart:` policy, deliberately: process-compose is
# the supervisor (`restart: always` on each of them), and a docker-level
# policy would race it — docker restarting a container that compose is in the
# middle of tearing down after the attached `up` returned.
#
# Images and the redis command mirror the compose file Railway used to generate
# for `railway dev` (`railway dev up --dry-run`), so containers behave the same
# locally as in the Railway environment. What is deliberately different:
#
#   * Fixed, repo-owned host ports (Railway assigned random ones per `up`, so
#     nothing downstream could hardcode them; we own them now, so we can).
#   * Throwaway local-only credentials (postgres / redis passwords below). These
#     are NOT secrets — they are the same for every developer, exactly like the
#     conventional `postgres:postgres`, and they never leave a laptop. No
#     production value is copied here.
#   * No caddy `railway-proxy`: its generated Caddyfile had zero routes, nothing
#     in the stack routed through it, and its `*.railway.localhost` domain is
#     rejected by the atproto OAuth client anyway (see oauth-node.ts).
#
# Host ports are the high 55432/56379/59000 rather than the standard
# 5432/6379/9000 so a developer's own local Postgres/Redis/S3 (very likely on
# the defaults) does not collide. services/web/.env points DATABASE_URL /
# REDIS_URL / BLOB_S3_ENDPOINT at these.

services:
  postgres:
    # Same image Railway's generated compose used, so SSL setup and PG version
    # match the deployed database. Pulled from ghcr.io (not Docker Hub).
    image: ghcr.io/railwayapp-templates/postgres-ssl:18.4
    # NOTE: this container cannot be stopped by a signal. Its PID 1 is the
    # image's `wrapper.sh`, which neither traps signals nor `exec`s postgres, so
    # SIGTERM (and SIGINT, and any `stop_signal:` set here) is swallowed —
    # `docker compose stop postgres` always burns the full 10s grace period and
    # then SIGKILLs, leaving an unclean shutdown for the next boot to recover.
    # process-compose therefore stops it with an explicit in-container
    # `pg_ctl stop -m fast` instead; see `shutdown:` on the `postgres` process
    # in process-compose.yaml. Worth knowing if you stop it by hand.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: butterydev
      POSTGRES_DB: buttery
      # The image stores data under a `pgdata` subdir of the mount point.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "55432:5432"
    volumes:
      - buttery_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Not what the stack gates on — process-compose runs its own equivalent
      # readiness probe (see process-compose.yaml), because it needs the result
      # as an exit code per poll rather than as container status. This one keeps
      # `docker compose ps`/`up --wait` honest for manual use.
      test: ["CMD-SHELL", "pg_isready -U postgres -d buttery"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # Same image and same redis-server invocation as Railway's generated
    # compose: the `lost+found` cleanup (a mounted volume can seed one, which
    # redis refuses to start over), auth, and the `--save 60 1` snapshot policy.
    # The one change is the data dir — Railway threaded it through a
    # `RAILWAY_VOLUME_MOUNT_PATH` env var; we own the mount, so it is /data.
    image: redis:8.2.1
    command: >
      sh -c "rm -rf /data/lost+found &&
      exec docker-entrypoint.sh redis-server
      --requirepass \"$$REDIS_PASSWORD\" --save 60 1 --dir /data"
    environment:
      REDIS_PASSWORD: butterydev
    ports:
      - "56379:6379"
    volumes:
      - buttery_redis:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage, standing in for the Railway `buttery-uploads`
  # bucket. Recipe images land here the moment a recipe comes through Buttery —
  # before publish, and for every draft that never publishes — so a laptop that
  # cannot reach this container cannot exercise the image path at all. That is
  # why it is in the stack rather than pointed at the shared remote bucket, as
  # it used to be: the one part of local dev that talked to Railway was also the
  # part where a mistake writes objects other developers see.
  #
  # RustFS, and it is the presigned-upload path that picks it. The browser POSTs
  # a recipe photo straight at this container with a form the web service signed
  # (services/web/src/lib/blob-storage.ts), so the emulator has to hold up the
  # whole security model of that form — not just accept the bytes. Three things
  # in particular, each of which some S3 emulator gets wrong:
  #
  #   * the POST policy's `eq $key` and `eq $Content-Type` conditions actually
  #     refuse a mismatched upload, so a form signed for one account cannot be
  #     redirected at another account's prefix or used to store a `text/html`
  #     body under an image key;
  #   * `content-length-range` refuses an over-sized body — the 2 MB cap;
  #   * an UNSIGNED GET is refused, because these are private household photos
  #     and a presigned GET is the only way in.
  #
  # Two predecessors did not:
  #   * `local-s3` (github.com/shyim/local-s3) implements no presigned POST at
  #     all and answers 403 to an unsigned OPTIONS, so a browser upload never
  #     reached the signature check.
  #   * MinIO did, and was here until its community edition was archived in
  #     April 2026 (no published images since October 2025). `ministack` was
  #     evaluated as the replacement and rejected on measurement: it ignores the
  #     policy's `$key` and `$Content-Type` (both 204) and serves objects
  #     unsigned with 200, so local dev would have stopped exercising the two
  #     properties the upload path rests on.
  #
  # RustFS is Apache 2.0 and, unlike MinIO, is NOT permissively CORS-open by
  # default — a bucket CORS rule has to be configured, which `dev:bucket` does on
  # boot. That is a feature here: Railway's buckets need the same rule, so the
  # requirement is now something local dev proves rather than something only
  # production discovers.
  #
  # Path-style routing only, same as before: a virtual-hosted request would
  # resolve `buttery-uploads.localhost` and never arrive, so services/web/.env
  # sets BLOB_S3_FORCE_PATH_STYLE=true. That flag is a local-dev knob, not a
  # production one; Railway's buckets are virtual-hosted and leave it unset.
  #
  # Credentials are throwaway and identical for every developer, exactly like
  # the postgres/redis passwords above.
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: butterydev
      RUSTFS_SECRET_KEY: butterydevsecret
      RUSTFS_VOLUMES: /data
    ports:
      - "59000:9000"
    volumes:
      - buttery_s3:/data
    healthcheck:
      # Unauthenticated by design — every S3 route wants a SigV4 signature, so
      # probing one would need a signing client in the container.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  buttery_pgdata:
  buttery_redis:
  buttery_s3:
