name: Deploy Docs

on:
  # Deploy on pushes to main that touch the docs service (or this workflow).
  push:
    branches: [main]
    paths:
      - "services/docs/**"
      - ".github/workflows/deploy-docs.yml"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress prod deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Skip husky git-hook install during `pnpm install` in CI.
  HUSKY: "0"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        # Version is read from the root package.json `packageManager` field.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Single source of truth for the Node version: `devEngines.runtime`
          # in package.json, which mise reads too. .nvmrc is vestigial.
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter @buttery/docs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: services/docs/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
