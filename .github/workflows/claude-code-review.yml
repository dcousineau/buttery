name: Claude Code Review

# Manual trigger only: this review runs ONLY when a review is explicitly
# requested from a specific reviewer (see the `if` gate below). It never
# auto-runs on push/open/reopen.
#
# NOTE: GitHub Apps cannot be added as PR reviewers — only real user or team
# accounts can. So the gate matches a human/bot *account* you request review
# from. Change REVIEWER_LOGIN below to a dedicated bot account if you create
# one; by default it matches the repo owner (request review from yourself to
# trigger a Claude review).
on:
  pull_request:
    types: [review_requested]

jobs:
  claude-review:
    # Only run when review is requested from this specific login.
    if: github.event.requested_reviewer.login == 'dcousineau'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
