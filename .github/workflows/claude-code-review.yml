name: Claude Code Review

# Manual, plugin-based PR review. Trigger by commenting exactly:
#
#     @claude review
#
# on a pull request. This runs the /code-review plugin flow (not a generic
# Claude pass). claude.yml deliberately skips this phrase so the two workflows
# don't both fire on the same comment.
on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Only on PR comments (issue_comment also fires for plain issues), and
    # only when the comment explicitly asks for a review.
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.issue.number }}"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
