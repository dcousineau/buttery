name: PR

on:
  pull_request:

# Annotations are emitted via workflow commands (::error), so no write scopes needed.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Skip husky git-hook install during `pnpm install` in CI.
  HUSKY: "0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node version (kept in sync with mise.toml).
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Web tests import from the built lexicons package (mirrors the typecheck script).
      - name: Build lexicons
        run: pnpm --filter @buttery/lexicons build

      - name: Run vitest
        # `github-actions` reporter emits inline ::error annotations on failing tests;
        # `default` keeps a readable log in the job output.
        run: pnpm --filter @buttery/web test --reporter=default --reporter=github-actions

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run eslint
        # Register a problem matcher that parses eslint's default (stylish)
        # output into inline PR annotations — dependency-free, same annotation
        # channel vitest's github-actions reporter uses. eslint's nonzero exit
        # still fails the job.
        run: |
          echo "::add-matcher::.github/eslint-matcher.json"
          pnpm lint
