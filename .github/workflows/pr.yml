name: PR

on:
  pull_request:

# Annotations are emitted via workflow commands (::error), so no write scopes needed.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Skip husky git-hook install during `pnpm install` in CI.
  HUSKY: "0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        # Version is read from the root package.json `packageManager` field.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Single source of truth for the Node version: `devEngines.runtime`
          # in package.json, which mise reads too. .nvmrc is vestigial.
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Web tests import from the built lexicons package (mirrors the typecheck script).
      - name: Build lexicons
        run: pnpm --filter @buttery/lexicons build

      - name: Run vitest
        # `github-actions` reporter emits inline ::error annotations on failing tests;
        # `default` keeps a readable log in the job output.
        run: pnpm --filter @buttery/web test --reporter=default --reporter=github-actions

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        # Version is read from the root package.json `packageManager` field.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Type-aware lint needs the same generated code typecheck does: `src/generated`
      # is gitignored, and without it every module that reaches a lexicon type is
      # `error`-typed, so the `no-unsafe-*` family reports the missing types as if
      # they were defects. ESLint never needed this because it never had types.
      - name: Build lexicons
        run: pnpm --filter @buttery/lexicons build

      - name: Run oxlint
        # `github` format emits ::error/::warning workflow commands directly, so
        # PR annotations need no problem matcher — same annotation channel
        # vitest's github-actions reporter uses. oxlint's nonzero exit still
        # fails the job; warn-level rules (react/exhaustive-deps) annotate
        # without failing it, as they did under eslint.
        run: pnpm lint --format github
