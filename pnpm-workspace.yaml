packages:
  - services/*
  - packages/*

allowBuilds:
  "@swc/core": true
  core-js: false
  esbuild: true
  lightningcss: true
  # @buttery/atproto-dev-env (local-only) pulls @atproto/dev-env, whose PDS uses
  # a native sqlite + image lib. Dev tooling only; never deployed.
  better-sqlite3: true
  sharp: true
  protobufjs: true
  # bullmq (@buttery/pipeline) pulls msgpackr, whose optional `msgpackr-extract`
  # is a native accelerator for the pack/unpack path. msgpackr works without it —
  # it falls back to its pure-JS encoder — and job payloads here are small JSON
  # objects, so the native build buys nothing worth a compiler on every install
  # and every Railway build image.
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - "@types/pg@8.20.3"
  # @buttery/atproto-dev-env (local-only dev tool) tracks @atproto/dev-env, whose
  # transitive @atproto/* deps use caret ranges and re-release frequently as a
  # batch — the release-age gate can't be satisfied by pinning. Exempt the atproto
  # scopes; this tool is never deployed. The web app's atproto deps stay pinned by
  # the lockfile regardless.
  - "@atproto/*"
  - "@atproto-labs/*"

minimumReleaseAge: 1440 # At least a day
